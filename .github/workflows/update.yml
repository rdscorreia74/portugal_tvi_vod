name: Update Portugal TVI Playlist

on:
  schedule:
    # Runs twice daily at 00:00 and 12:00 UTC
    - cron: '0 0,12 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Silences Node runtime warnings across all runner steps
env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  update-playlist:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run playlist generator
        run: python update_playlist.py

      - name: Commit and push updated playlist
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Auto-update TVI playlist
          file_pattern: 'portugal_tvi.m3u'
          add_options: '--all'
